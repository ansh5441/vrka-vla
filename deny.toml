# cargo-deny configuration for vrka-vla supply-chain, license, and FFI hygiene.
# Run via: `cargo deny check`

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
notice = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
# Forbid duplicate versions of the same crate (critical for C-FFI *-sys crates
# such as libmujoco-sys, libc, osqp-sys, or io-uring bindings to avoid ABI symbol clashes).
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Explicitly ban known legacy or unmaintained C-FFI sys crates or duplicate linkers here
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
