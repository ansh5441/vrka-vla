[workspace]
resolver = "2"
members = [
    "crates/vrka-abi",
    "crates/vrka-shm",
    "crates/vrka-cbf",
    "crates/vrka-rt",
    "crates/vrka-swarm",
    "crates/vrka-sim",
    "crates/vrka-ebpf",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"
readme = "README.md"
authors = ["Anshuman <ansh5441@gmail.com>"]
repository = "https://github.com/ansh5441/vrka-vla"
keywords = ["robotics", "real-time", "vla", "safety-critical", "no-std"]
categories = ["embedded", "science::robotics", "concurrency", "no-std"]

[workspace.dependencies]
vrka-abi = { path = "crates/vrka-abi", default-features = false }
vrka-shm = { path = "crates/vrka-shm", default-features = false }
vrka-cbf = { path = "crates/vrka-cbf", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Enable pedantic and cargo lint groups at lower priority so individual rules override cleanly
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Critical real-time & memory-safety invariants
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Stack & numeric safety warnings
large_stack_arrays = "warn"
cast_possible_truncation = "warn"
